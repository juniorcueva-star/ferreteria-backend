spring:
  application:
    name: ferreteria-backend

  config:
    # En local lee el archivo .env como si fueran propiedades (busca en la carpeta
    # actual y en backend/, por si se ejecuta desde la raiz del proyecto).
    # En la nube no hay .env: se usan las variables de entorno reales, que siempre
    # tienen prioridad sobre este archivo.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ferreteria}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Hibernate solo COMPRUEBA que las entidades coincidan con las tablas.
      # Nunca crea ni modifica tablas: eso lo hace solo Flyway.
      ddl-auto: validate
    # Cierra la conexion a la BD al terminar el servicio, no al terminar la respuesta HTTP
    open-in-view: false

  flyway:
    # Ejecuta los scripts de src/main/resources/db/migration al arrancar
    enabled: true
    locations: classpath:db/migration

server:
  # Railway asigna el puerto en la variable PORT; en local se usa 8080
  port: ${PORT:8080}
