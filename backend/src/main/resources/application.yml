spring:
  application:
    name: ferreteria-backend

  profiles:
    # Sin perfil indicado se usa "dev", que carga los datos de demostracion.
    # Para otro entorno: variable SPRING_PROFILES_ACTIVE (Ej: prod).
    default: dev

  config:
    # En local lee el archivo .env como si fueran propiedades (busca en la carpeta
    # actual y en backend/, por si se ejecuta desde la raiz del proyecto).
    # En la nube no hay .env: se usan las variables de entorno reales, que siempre
    # tienen prioridad sobre este archivo.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:ferreteria}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Hibernate solo COMPRUEBA que las entidades coincidan con las tablas.
      # Nunca crea ni modifica tablas: eso lo hace solo Flyway.
      ddl-auto: validate
    # Cierra la conexion a la BD al terminar el servicio, no al terminar la respuesta HTTP
    open-in-view: false

  data:
    web:
      pageable:
        # Ningun listado devuelve todo: 20 por defecto y como maximo 100 por pagina
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      # Fotos de productos
      max-file-size: 2MB
      max-request-size: 3MB

  flyway:
    # Ejecuta los scripts de src/main/resources/db/migration al arrancar
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    # Ordena los grupos por su numero (01. Autenticacion, 02. Empresas...) y recuerda el token al recargar
    tags-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json

server:
  # Railway asigna el puerto en la variable PORT; en local se usa 8080
  port: ${PORT:8080}

# ---------------------------------------------------------------------
# Configuracion propia de la aplicacion
# ---------------------------------------------------------------------
app:
  jwt:
    # Clave para firmar los tokens (minimo 32 caracteres). Obligatoria: variable JWT_SECRET.
    secreto: ${JWT_SECRET:}
    # 8 horas = un turno de trabajo
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:480}
  admin:
    # Se crea al arrancar si no existe ningun ADMIN activo
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  imagenes:
    # Opcional. Si se configura, las fotos se suben a Cloudinary; si no, se guardan en la carpeta local.
    cloudinary-url: ${CLOUDINARY_URL:}
    directorio: ${IMAGENES_DIRECTORIO:./imagenes}
  demo:
    # Contrasena de los usuarios de demostracion (solo perfil dev)
    password: ${DEMO_PASSWORD:}
  # Zona horaria para "un dia" en los reportes y cierres
  zona-horaria: America/Lima
  cors:
    # Origenes del frontend que pueden llamar a la API (separados por coma)
    origenes: ${CORS_ORIGENES:http://localhost:5173,http://localhost:3000}
